# CS・SR分析ダッシュボード 日次自動更新
#
# このファイルはGitHubリポジトリの .github/workflows/daily-update.yml として配置する。
#
# 毎日 日本時間 10:00 に起動し、以下を自動実行する:
#   1. Google Drive から週次CSVを収集して全期間を再集計 (etl_cs_dashboard.py)
#   2. 最新実績にもとづく所見を自動生成 (generate_insights.py)
#   3. ダッシュボードHTMLを生成 (build_dashboard.py)
#   4. index.html を更新してコミット → GitHub Pages に自動反映
#
# 手動で今すぐ実行したい場合は、GitHubの Actions タブから
# 「Run workflow」ボタンを押せば同じ処理が走る。

name: daily-dashboard-update

on:
  schedule:
    # cron は UTC 基準。01:00 UTC = 10:00 JST(日本時間)
    # ※GitHub側の混雑状況により数分〜十数分遅れて起動することがある(仕様)
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install pandas google-api-python-client google-auth

      - name: サービスアカウント認証情報を復元
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          if [ -z "$GDRIVE_SA_JSON" ]; then
            echo "::error::シークレット GDRIVE_SA_JSON が未設定です。リポジトリの Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi
          printf '%s' "$GDRIVE_SA_JSON" > /tmp/sa.json
          python -c "import json;json.load(open('/tmp/sa.json'));print('[OK] 認証情報のJSON形式を確認しました')"

      - name: ETL実行(Google Driveから全期間を再集計)
        env:
          # 探索する起点フォルダID(カンマ区切り)。
          # 1つ目: 21期フォルダ / 2つ目以降: 20期など過去期のCSVを置いたフォルダ。
          # リポジトリの Settings > Secrets and variables > Actions > Variables で
          # DASHBOARD_ROOT_IDS を設定すると差し替えられる(未設定時は21期のみ)。
          DASHBOARD_ROOT_IDS: ${{ vars.DASHBOARD_ROOT_IDS }}
        run: |
          python etl_cs_dashboard.py \
            --mode drive \
            --credentials /tmp/sa.json \
            --output cs_sr_dashboard_data.json

      - name: 所見(insights)を自動生成
        run: python generate_insights.py --data cs_sr_dashboard_data.json

      - name: ダッシュボードHTMLを生成
        run: |
          python build_dashboard.py
          cp cs_sr_dashboard.html index.html
          ls -lh index.html

      - name: 個人情報ファイルを削除(コミット前の安全確認)
        # customer_lookup.csv には顧客氏名などの個人情報が含まれるため、
        # 公開リポジトリには絶対にコミットしない。生成された場合はここで確実に消す。
        run: |
          rm -f customer_lookup.csv
          if git status --porcelain | grep -q "customer_lookup.csv"; then
            echo "::error::customer_lookup.csv が残っています。処理を中止します。"
            exit 1
          fi

      - name: 変更をコミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cs_sr_dashboard.html cs_sr_dashboard_data.json
          if git diff --cached --quiet; then
            echo "[INFO] 変更なし。新しい週次データがまだ追加されていない可能性があります。"
            exit 0
          fi
          git commit -m "chore: ダッシュボード日次更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          git push

      - name: 失敗時のヒント
        if: failure()
        run: |
          echo "::notice::よくある原因: (1)サービスアカウントに共有ドライブの閲覧権限が無い (2)Google Drive APIが無効 (3)DASHBOARD_ROOT_IDS のフォルダIDが誤っている"
