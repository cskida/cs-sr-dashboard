name: ダッシュボード更新

# 実行タイミング
#   1. 毎週月曜 9:00 (日本時間) に自動実行
#   2. GitHubの画面から「Run workflow」ボタンで手動実行(誰でも・いつでも)
on:
  schedule:
    - cron: '0 0 * * 1'   # UTC 00:00 = 日本時間 09:00
  workflow_dispatch:

permissions:
  contents: write   # index.html をコミットするために必要

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install pandas google-api-python-client google-auth

      - name: サービスアカウントの鍵ファイルを作成
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GitHub Secret「GOOGLE_SERVICE_ACCOUNT_JSON」が設定されていません。SETUP_AUTOMATION.md の手順4を確認してください。"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
          python -c "import json;json.load(open('service_account.json'));print('鍵ファイルの形式OK')"

      - name: Google Drive から最新データを取得してダッシュボードを生成
        run: python update_dashboard.py --mode drive --credentials service_account.json

      - name: 鍵ファイルを削除
        if: always()
        run: rm -f service_account.json

      - name: 生成結果を確認
        run: |
          test -f index.html || { echo "::error::index.html が生成されませんでした"; exit 1; }
          SIZE=$(stat -c%s index.html)
          echo "index.html サイズ: $SIZE バイト"
          # 極端に小さい場合は生成失敗とみなす(通常2MB前後)
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::index.html が異常に小さいため、コミットを中止します"
            exit 1
          fi

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 表示に使うのは index.html だけ。中間ファイル(50MB超)はコミットしない
          git add index.html
          if git diff --staged --quiet; then
            echo "データに変更がないため、コミットは行いません。"
          else
            git commit -m "ダッシュボード自動更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
            git push
            echo "更新をコミットしました。数分後に GitHub Pages に反映されます。"
          fi
